name: Repository quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check public files and validation guardrails
        run: |
          python3 -B .github/scripts/check_repository.py
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test production safeguards with offline fixtures
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
