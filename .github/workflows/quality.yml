name: Repository quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check public files and validation guardrails
        run: |
          python3 -B .github/scripts/check_repository.py
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test production safeguards with offline fixtures
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
